<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Login Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="logo">
        <span>f</span>
    </div>

    <h1>Social Login Lab</h1>

    <p class="description">
        Cybersecurity Awareness Simulation
    </p>

    <div class="login-box">
        <h2>Welcome Back</h2>
        <p>Enter your test email</p>

        <form id="testForm">
            <input
                type="email"
                name="email"
                placeholder="Test email"
                required
            >

            <button type="submit">Send test</button>
        </form>

        <p id="result"></p>

        <div class="separator"></div>

        <p class="warning">
            This is an educational simulation. Never enter real credentials.
        </p>
    </div>

    <footer>Cybersecurity Lab © 2026</footer>

</div>

<script>
document.getElementById("testForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const result = document.getElementById("result");
    const email = this.email.value;

    result.textContent = "Sending...";

    try {
        const response = await fetch("/api/send", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email })
        });

        const data = await response.json();
        result.textContent = data.message;
    } catch (error) {
        result.textContent = "Connection error";
    }
});
</script>

</body>
</html>
